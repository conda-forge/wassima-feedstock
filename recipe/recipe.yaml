schema_version: 1

context:
  name: wassima
  version: "2.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wassima-${{ version }}.tar.gz
  sha256: f74b5441151728c54118ece6d747cfe92b2c595a3d062a1955f42a2bc894cd10

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.6.0,<2
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - wassima
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Access your OS root certificates with the atmost ease
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/jawah/wassima

extra:
  recipe-maintainers:
    - thewchan
